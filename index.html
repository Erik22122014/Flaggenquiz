<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4efe6">
  <title>Flaggenquiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Flaggenquiz Startseite">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>flaggen<span class="brand-dot">.</span>quiz</span>
      </a>
      <div class="topbar-meta">
        <span class="live-dot" aria-hidden="true"></span>
        <span>10 Fragen · Weltweit</span>
      </div>
    </header>

    <section class="quiz-view" id="quiz-view">
      <div class="intro-row">
        <div>
          <p class="eyebrow">Die Welt in Farben</p>
          <h1>Welche Flagge<br><em>ist das?</em></h1>
        </div>
        <div class="score-block">
          <span class="score-label">Punkte</span>
          <strong id="score">00</strong>
        </div>
      </div>

      <div class="progress-row">
        <span id="question-count">Frage 01 / 10</span>
        <div class="progress-track" aria-label="Quiz-Fortschritt"><span id="progress-bar"></span></div>
        <span id="streak">0er Serie</span>
      </div>

      <div class="quiz-card">
        <div class="flag-stage">
          <span class="stage-label">Erkennst du mich?</span>
          <div class="flag-frame">
            <img id="flag-image" src="https://flagcdn.com/w640/jp.png" alt="Flagge">
          </div>
          <span class="flag-caption">Tipp: Achte auf die Details.</span>
        </div>
        <div class="answers" id="answers" role="group" aria-label="Antwortmöglichkeiten"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
      </div>

      <footer class="quiz-footer">
        <span class="keyboard-hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> zum Antworten</span>
        <button class="skip-button" id="skip-button" type="button">Überspringen <span aria-hidden="true">↗</span></button>
      </footer>
    </section>

    <section class="result-view hidden" id="result-view" aria-live="polite">
      <p class="eyebrow">Quiz beendet</p>
      <h2>Starke<br><em>Weltkenntnis.</em></h2>
      <div class="result-score"><strong id="final-score">0</strong><span>/ 10 Punkte</span></div>
      <p id="result-message">Du hast dich souverän durch die Weltkarten gespielt.</p>
      <button class="primary-button" id="restart-button" type="button">Noch eine Runde <span aria-hidden="true">↗</span></button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
